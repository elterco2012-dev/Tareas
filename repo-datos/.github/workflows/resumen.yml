# Resumen diario de "Mis tareas" por Telegram (y opcionalmente por mail).
# Va en el repositorio PRIVADO de datos, en .github/workflows/resumen.yml.
# Pasos para configurarlo: ver INSTRUCCIONES.md.
name: Resumen diario

on:
  # Horario de GitHub: a veces se atrasa horas o se saltea. Para que sea puntual, lo puede disparar
  # cron-job.org (ver INSTRUCCIONES.md): en ese caso se borran estas tres líneas de schedule.
  schedule:
    - cron: "0 10 * * 1-5"   # 7:00 en Argentina (10:00 UTC), de lunes a viernes
    - cron: "45 18 * * 5"    # viernes 15:45 en Argentina: revisión de la semana
  workflow_dispatch:          # botón "Run workflow" para probarlo (y lo que usa cron-job.org)
    inputs:
      programa:
        description: "Vacío para probar. cron-job.org manda diario o semanal"
        type: string
        default: ""

permissions:
  contents: read

jobs:
  resumen:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Enviar resumen
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
          SMTP_TO: ${{ secrets.SMTP_TO }}
          ZONA_HORARIA: America/Argentina/Buenos_Aires
          PROGRAMA: ${{ github.event.schedule || inputs.programa }}
          APP_URL: ${{ vars.APP_URL }}
        run: |
          node --input-type=module <<'JS'
          import {readFileSync} from 'node:fs';
          import net from 'node:net';
          import tls from 'node:tls';
          const E=process.env;
          const zona=E.ZONA_HORARIA||'America/Argentina/Buenos_Aires';
          // Fecha (AAAA-MM-DD) en la zona horaria de la persona, no en la del servidor
          const fecha=d=>new Intl.DateTimeFormat('en-CA',{timeZone:zona,year:'numeric',month:'2-digit',day:'2-digit'}).format(d);
          const hoy=fecha(new Date());
          const dias=(a,b)=>Math.round((Date.parse(a+'T00:00:00Z')-Date.parse(b+'T00:00:00Z'))/86400000);
          const diaMes=f=>String(f).slice(8,10).replace(/^0/,'')+'/'+String(f).slice(5,7).replace(/^0/,'');   // 2026-10-05 → 5/10

          let tareas;
          try{tareas=JSON.parse(readFileSync('tareas.json','utf8'))}catch{console.log('Todavía no hay tareas.json: nada para avisar.');process.exit(0)}
          const pend=tareas.filter(t=>t&&!t.done&&!t.deletedAt);   // sin las de la papelera
          // Viernes 15:45: la revisión de la semana (lo que no tiene fecha, lo que espera respuesta, lo pateado)
          // Automática: la del horario de GitHub o la que dispara cron-job.org (diario o semanal)
          const automatico=E.GITHUB_EVENT_NAME==='schedule'||E.PROGRAMA==='diario'||E.PROGRAMA==='semanal';
          if(E.PROGRAMA==='45 18 * * 5'||E.PROGRAMA==='semanal'){
            const lunes=new Date(Date.parse(hoy+'T12:00:00Z'));lunes.setUTCDate(lunes.getUTCDate()-(lunes.getUTCDay()+6)%7);
            const desde=lunes.toISOString().slice(0,10);
            const hechas=tareas.filter(t=>t&&t.done&&!t.deletedAt&&t.completedAt&&fecha(new Date(t.completedAt))>=desde).length;
            // Como en la app: las sin fecha que revisaste ("Sigue así") en el último mes no vuelven a aparecer
            const mes=Date.now()-30*86400000;
            const sinFecha=pend.filter(t=>!t.waiting&&!t.due&&!(t.reviewedAt&&Date.parse(t.reviewedAt)>=mes)),viejas=sinFecha.filter(t=>t.createdAt&&dias(hoy,fecha(new Date(t.createdAt)))>30).length;
            const esp=pend.filter(t=>t.waiting).length,pateadas=pend.filter(t=>!t.waiting&&(t.postponed||0)>=3).length;
            if(!sinFecha.length&&!esp&&!pateadas){console.log('Nada para revisar esta semana.');process.exit(0)}
            const items=[];
            if(sinFecha.length)items.push(sinFecha.length+' sin fecha'+(viejas?' ('+viejas+' con más de un mes)':''));
            if(esp)items.push(esp+' esperando respuesta');
            if(pateadas)items.push(pateadas+(pateadas===1?' pateada':' pateadas')+' 3 veces o más');
            const url=(E.APP_URL||'').trim();
            const semanal='Revisión de la semana: '+items.join(', ')+'.'+(hechas?'\nEsta semana terminaste '+hechas+(hechas===1?' tarea.':' tareas.'):'')+'\n'+(url?'Revisalas en 2 minutos: '+url.replace(/\/?$/,'/')+'?revisar=1':'Abrí la app y tocá "Revisión de la semana" (abajo, junto a Terminadas).');
            console.log(semanal);
            await enviar(semanal,'revisión de la semana');
          }
          const vencidas=pend.filter(t=>!t.waiting&&t.due&&t.due<hoy).sort((a,b)=>a.due.localeCompare(b.due));
          // Para hoy: primero las que tienen hora, en orden
          const paraHoy=pend.filter(t=>!t.waiting&&t.due===hoy).sort((a,b)=>(a.time||'99:99').localeCompare(b.time||'99:99'));
          const desdeEspera=t=>t.lastNudge||t.waitingSince;
          const esperando=pend.filter(t=>t.waiting&&(t.followUp?t.followUp<=hoy:desdeEspera(t)&&dias(hoy,fecha(new Date(desdeEspera(t))))>=3));
          // Token de GitHub de la app: la fecha de vencimiento que se cargó en Sincronización (ajustes.json)
          let aviso='';
          try{
            const tok=(JSON.parse(readFileSync('ajustes.json','utf8')).tokens)||{};
            for(const f of Object.values(tok)){
              const d=dias(String(f),hoy);if(!(d<=7&&d>=-3))continue;
              const dm=diaMes(f);
              aviso='⚠ El token de GitHub de la app '+(d<0?'venció el '+dm:d===0?'vence hoy':d===1?'vence mañana':'vence en '+d+' días ('+dm+')')+'. Generá uno nuevo y cargalo en Sincronización, con su fecha.';
            }
          }catch{}
          if(!vencidas.length&&!paraHoy.length&&!esperando.length&&!aviso){console.log('Nada vencido, para hoy ni esperando respuesta: no se envía nada.');process.exit(0)}

          const plural=(n,a,b)=>n+' '+(n===1?a:b);
          const partes=[];
          if(vencidas.length)partes.push(plural(vencidas.length,'vencida','vencidas'));
          if(paraHoy.length)partes.push(paraHoy.length+' para hoy');
          if(esperando.length)partes.push(esperando.length+' esperando respuesta');
          const linea=t=>'• '+(t.time&&t.due===hoy?t.time+' ':'')+t.title+(t.priority==='Alta'?' (ALTA)':'')+(t.requester?' · @'+t.requester:'')+((t.postponed||0)>=3?' (pospuesta '+t.postponed+' veces)':'');
          const encabezado=(aviso?aviso+'\n\n':'')+'Buen día.'+(partes.length?' '+partes.join(', '):'');
          let msg=encabezado;
          if(vencidas.length)msg+='\n\nVencidas\n'+vencidas.map(t=>{const d=dias(hoy,t.due);return linea(t)+' · '+(d===1?'venció ayer':'venció hace '+d+' días')}).join('\n');
          if(paraHoy.length)msg+='\n\nPara hoy\n'+paraHoy.map(linea).join('\n');
          if(esperando.length)msg+='\n\nEsperando respuesta\n'+esperando.map(t=>{const d=dias(hoy,fecha(new Date(desdeEspera(t))));return '• '+t.title+' · '+(t.waitingOn||'sin nombre')+', '+(t.followUp?(t.followUp===hoy?'volver a mirar hoy':'había que mirarla el '+diaMes(t.followUp)):(t.lastNudge?'reclamado ':'')+(d===1?'hace 1 día':'hace '+d+' días'))}).join('\n');
          if(msg.length>4000)msg=msg.slice(0,3990)+'\n…';
          // En el registro de GitHub no quedan los títulos de las tareas (lo pueden leer servicios como cron-job.org)
          console.log(encabezado);
          await enviar(msg,partes.join(', ')||'aviso del token');

          async function telegram(texto){
            const api=E.TELEGRAM_API||'https://api.telegram.org';
            const r=await fetch(api+'/bot'+E.TELEGRAM_TOKEN+'/sendMessage',{method:'POST',headers:{'Content-Type':'application/json'},
              body:JSON.stringify({chat_id:E.TELEGRAM_CHAT_ID,text:texto,disable_web_page_preview:true})});
            const j=await r.json().catch(()=>({}));
            if(!r.ok||!j.ok)throw new Error('Telegram respondió '+r.status+': '+(j.description||'')+'. Revisá TELEGRAM_TOKEN y TELEGRAM_CHAT_ID.');
            console.log('Enviado por Telegram.');
          }

          // Mail sin dependencias: puerto 465 (TLS directo) o 587 (STARTTLS)
          async function mail(texto,asuntoTxt){
            const host=E.SMTP_HOST,port=Number(E.SMTP_PORT||465),user=E.SMTP_USER,to=E.SMTP_TO||user;
            let sock=port===465?tls.connect({host,port,servername:host}):net.connect({host,port});
            let buf='',lines=[],wake=null,fail=null;
            const hook=s=>{s.setEncoding('utf8');s.on('data',d=>{buf+=d;let i;while((i=buf.indexOf('\r\n'))>=0){lines.push(buf.slice(0,i));buf=buf.slice(i+2)}wake&&wake()});s.on('error',e=>{fail=e;wake&&wake()})};
            hook(sock);
            const reply=async()=>{
              const limite=Date.now()+20000;
              for(;;){
                if(fail)throw fail;
                const i=lines.findIndex(l=>/^\d{3} /.test(l));
                if(i>=0){const r=lines.splice(0,i+1);return {code:Number(r[i].slice(0,3)),text:r.join(' | ')}}
                if(Date.now()>limite)throw new Error('El servidor de mail no responde');
                await new Promise(res=>{wake=res;setTimeout(res,500)});wake=null;
              }
            };
            const cmd=async(c,ok)=>{if(c!==null)sock.write(c+'\r\n');const r=await reply();if(!ok.includes(r.code))throw new Error('Mail: '+r.text);return r};
            await cmd(null,[220]);
            let ehlo=await cmd('EHLO mis-tareas',[250]);
            if(port!==465&&/STARTTLS/i.test(ehlo.text)){
              await cmd('STARTTLS',[220]);
              sock.removeAllListeners('data');sock.removeAllListeners('error');
              sock=tls.connect({socket:sock,servername:host});hook(sock);
              await new Promise((res,rej)=>{sock.once('secureConnect',res);sock.once('error',rej)});
              await cmd('EHLO mis-tareas',[250]);
            }
            await cmd('AUTH LOGIN',[334]);
            await cmd(Buffer.from(user).toString('base64'),[334]);
            await cmd(Buffer.from(E.SMTP_PASS||'').toString('base64'),[235]);
            await cmd('MAIL FROM:<'+user+'>',[250]);
            await cmd('RCPT TO:<'+to+'>',[250,251]);
            await cmd('DATA',[354]);
            const asunto='=?UTF-8?B?'+Buffer.from('Mis tareas: '+asuntoTxt).toString('base64')+'?=';
            const cuerpo=texto.replace(/\r?\n/g,'\r\n').replace(/^\./gm,'..');
            await cmd('From: '+user+'\r\nTo: '+to+'\r\nSubject: '+asunto+'\r\nMIME-Version: 1.0\r\nContent-Type: text/plain; charset=utf-8\r\nContent-Transfer-Encoding: 8bit\r\n\r\n'+cuerpo+'\r\n.',[250]);
            await cmd('QUIT',[221]).catch(()=>{});
            sock.end();
            console.log('Enviado por mail a '+to+'.');
          }

          // Por Telegram, por mail o por los dos, según los secretos que estén cargados
          async function enviar(texto,asuntoTxt){
            const conTelegram=!!(E.TELEGRAM_TOKEN&&E.TELEGRAM_CHAT_ID),conMail=!!(E.SMTP_HOST&&E.SMTP_USER&&E.SMTP_PASS);
            // Recién copiado y todavía sin secretos: las corridas programadas no fallan (ni mandan mails de error)
            const ninguno=!['TELEGRAM_TOKEN','TELEGRAM_CHAT_ID','SMTP_HOST','SMTP_USER','SMTP_PASS'].some(k=>E[k]);
            if(ninguno&&automatico){console.log('Todavía no están cargados los secretos de Telegram (ni los de mail): no se envía nada. Ver INSTRUCCIONES.md.');process.exit(0)}
            if(!conTelegram&&!conMail){console.error('Falta configurar los secretos TELEGRAM_TOKEN y TELEGRAM_CHAT_ID (o los SMTP_* para mail). Ver INSTRUCCIONES.md.');process.exit(1)}
            let error=false;
            for(const [ok,fn] of [[conTelegram,()=>telegram(texto)],[conMail,()=>mail(texto,asuntoTxt)]]){
              if(!ok)continue;
              try{await fn()}catch(e){console.error(e.message);error=true}
            }
            process.exit(error?1:0);
          }
          JS
